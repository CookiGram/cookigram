<link rel="stylesheet" href="./direct-planner.css">
<main class="planner-main">
  <h1 class="sr-only">Planifier ma semaine</h1>
  <div id="planner-empty" class="planner-empty-state" hidden>
    <img src="../assets/illustrations/empty-fridge.webp" alt="Réfrigérateur vide" loading="lazy">
  </div>
  <div id="planner-content" hidden>
    <section class="planner-panel planner-toolbar" aria-label="Navigation de la semaine">
      <h2 id="planner-week-title">Ma semaine</h2>
      <div class="planner-week-actions"><button type="button" class="btn planner-week-arrow" data-week-prev aria-label="Semaine précédente">‹</button><button type="button" class="btn" data-week-today>Cette semaine</button><button type="button" class="btn planner-week-arrow" data-week-next aria-label="Semaine suivante">›</button><button type="button" class="btn primary" data-export-calendar aria-label="Exporter cette semaine" title="Exporter cette semaine">↓</button></div>
    </section>
    <div class="planner-board-shell">
      <section class="planner-panel planner-unplaced" aria-labelledby="unplaced-title">
        <div class="planner-section-heading"><h2 id="unplaced-title">À placer</h2></div>
        <div id="planner-selection" class="planner-list" aria-live="polite"></div>
      </section>
      <section class="planner-panel planner-week-panel" aria-labelledby="week-board-title">
        <h2 id="week-board-title" class="sr-only">Jours de la semaine</h2>
        <div id="planner-week" class="planner-board" aria-live="polite"></div>
      </section>
    </div>
  </div>
  <div id="planner-feedback" class="planner-feedback" role="status" aria-live="polite" hidden><span id="planner-feedback-message"></span></div>
</main>
