<main class="selection-page">
  <section class="view-intro selection-header">
    <h1 class="visually-hidden">Ma sélection</h1>
  </section>
  <section class="selection-list" data-selection-list aria-live="polite"></section>
  <p class="selection-empty-state" data-selection-empty>
    <img src="../assets/illustrations/empty-fridge.webp" alt="Réfrigérateur vide" loading="lazy">
  </p>
  <section id="courses" class="selection-shopping" data-selection-shopping hidden aria-live="polite">
    <div class="selection-shopping-head"><h2 class="visually-hidden">Courses</h2><div class="shopping-actions"><button type="button" class="btn secondary" data-copy-shopping aria-label="Copier la liste de courses" title="Copier la liste de courses">⧉</button><button type="button" class="btn secondary" data-share-shopping aria-label="Partager la liste de courses" title="Partager la liste de courses">↗</button><button type="button" class="btn secondary" data-export-shopping aria-label="Exporter la liste de courses" title="Exporter la liste de courses">↓</button><a class="btn primary selection-planner-link" href="../meal-planner/" aria-label="Ouvrir le Planner" title="Ouvrir le Planner" hidden>→</a></div></div>
    <p class="shopping-loading" data-shopping-loading>Chargement de la liste…</p>
    <div class="shopping-list" data-shopping-list></div>
  </section>
</main>
