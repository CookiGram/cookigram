name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipe-check:
    name: Validation du contrat public (< 15s)
    runs-on: ubuntu-latest
    env:
      CONTRACT_VERSION: "1.0.0"
      CONTRACT_SHA: b567e88acdcee69302c926caa6f5222508b7a051
      CONTENT_SHA: ${{ github.sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout CookiGram Recettes (Public)
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Vérifier la provenance du contrat public
        run: |
          actual="$(git ls-remote https://github.com/CookiGram/cookigram-contract.git "refs/tags/v${CONTRACT_VERSION}^{}" | cut -f1)"
          test "${actual}" = "${CONTRACT_SHA}"

      - name: Installer le contrat public versionné
        run: python -m pip install "git+https://github.com/CookiGram/cookigram-contract.git@v${CONTRACT_VERSION}"

      - name: Vérifier les pins et produire le rapport JSON
        run: python scripts/check-pins.py --json

      - name: Valider le corpus avec le CLI canonique
        run: python -m cookigram_contract validate .

      - name: Audit des illustrations et prompts
        run: python scripts/audit-recipe-images.py --check

      - name: Linter public SEO et contenu
        run: python scripts/lint-public-content.py --check --warn-only --json

      - name: Tester l’export iCalendar du Planner
        run: node --test tests/calendar-export.test.mjs

      - name: Tester les contrats UX statiques
        run: python -m unittest discover -s tests -v

  private-integration:
    name: Intégration Core privée (push de confiance uniquement)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      HAVE_CORE_KEY: ${{ secrets.CORE_SSH_KEY != '' }}
      CONTENT_SHA: ${{ github.sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout CookiGram Recettes (Public)
        uses: actions/checkout@v4

      - name: Read pinned Core SHA
        id: core-ref
        run: echo "sha=$(cat .core-version | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Checkout CookiGram Core Engine (Private)
        if: ${{ env.HAVE_CORE_KEY == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: CookiGram/cookigram-core
          ssh-key: ${{ secrets.CORE_SSH_KEY }}
          ref: ${{ steps.core-ref.outputs.sha }}
          path: core

      - name: Validation avec CookiGram Core
        if: ${{ env.HAVE_CORE_KEY == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ./core
          python scripts/check-pins.py --markdown --no-remote
          python -m generator.recipe_check --root .
          python -m generator.build --content-dir . --output /tmp/_test_site
          python scripts/check-generated-surfaces.py --site-dir /tmp/_test_site
