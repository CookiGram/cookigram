name: Deploy GitHub Pages
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CONTENT_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout CookiGram Recettes (Public)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_SHA }}

      - name: Read pinned public builder
        id: builder
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          data = json.loads(Path(".builder.json").read_text(encoding="utf-8"))
          for key in ("release", "artifact", "sha256", "core_sha"):
              value = data.get(key)
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(f"Invalid .builder.json field: {key}")
              print(f"{key}={value}")
          PY

          test "$(tr -d '[:space:]' < .core-version)" = "$(python -c 'import json; print(json.load(open(".builder.json"))["core_sha"])')"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install "PyYAML>=6,<7"

      - name: Vérifier les pins et produire le rapport JSON
        run: python scripts/check-pins.py --json

      - name: Download exactly the qualified Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: cookigram-pages-${{ env.CONTENT_SHA }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: _site

      - name: Verify consumer fragments in generated site
        run: python scripts/check-generated-surfaces.py --site-dir _site

      - name: Verify qualified artifact provenance
        env:
          EXPECTED_CORE_SHA: ${{ steps.builder.outputs.core_sha }}
          EXPECTED_CONTENT_SHA: ${{ env.CONTENT_SHA }}
          EXPECTED_BUILDER_RELEASE: ${{ steps.builder.outputs.release }}
          EXPECTED_BUILDER_ARTIFACT: ${{ steps.builder.outputs.artifact }}
          EXPECTED_BUILDER_SHA256: ${{ steps.builder.outputs.sha256 }}
          EXPECTED_CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = json.loads(Path("_site/provenance.json").read_text(encoding="utf-8"))
          expected = {
              "content_sha": os.environ["EXPECTED_CONTENT_SHA"],
              "core_sha": os.environ["EXPECTED_CORE_SHA"],
              "contract_version": "1.0.0",
              "builder_release": os.environ["EXPECTED_BUILDER_RELEASE"],
              "builder_artifact": os.environ["EXPECTED_BUILDER_ARTIFACT"],
              "builder_sha256": os.environ["EXPECTED_BUILDER_SHA256"],
              "pages_artifact": f"cookigram-pages-{os.environ['EXPECTED_CONTENT_SHA']}",
              "qualifying_ci_run_id": os.environ["EXPECTED_CI_RUN_ID"],
          }
          for key, value in expected.items():
              assert provenance.get(key) == value, (key, provenance.get(key), value)
          print(json.dumps(provenance, indent=2))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
