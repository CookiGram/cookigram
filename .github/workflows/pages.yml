name: Deploy GitHub Pages
on:
  workflow_dispatch:
    inputs:
      content_sha:
        description: "Validated content commit to publish"
        required: true
        type: string
      ci_run_id:
        description: "Successful CI run qualifying that commit"
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CONTENT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.content_sha || github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_run_id || github.event.workflow_run.id }}
    steps:
      - name: Checkout CookiGram Recettes (Public)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_SHA }}

      - name: Read pinned public builder
        id: builder
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          data = json.loads(Path(".builder.json").read_text(encoding="utf-8"))
          for key in ("release", "artifact", "sha256", "core_sha", "contract_version", "contract_source_sha", "contract_artifact", "contract_sha256"):
              value = data.get(key)
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(f"Invalid .builder.json field: {key}")
              print(f"{key}={value}")
          PY

          test "$(tr -d '[:space:]' < .core-version)" = "$(python -c 'import json; print(json.load(open(".builder.json"))["core_sha"])')"

      - name: Verify explicitly dispatched CI provenance
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_CONTENT_SHA: ${{ env.CONTENT_SHA }}
          EXPECTED_CI_RUN_ID: ${{ env.CI_RUN_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CONTENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_CI_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_CI_RUN_ID" > "$RUNNER_TEMP/ci-run.json"
          python - "$RUNNER_TEMP/ci-run.json" "$EXPECTED_CONTENT_SHA" "$EXPECTED_CI_RUN_ID" <<'PY'
          import json
          import sys
          from pathlib import Path

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_sha, expected_id = sys.argv[2:]
          expected = {
              "id": int(expected_id),
              "path": ".github/workflows/ci.yml",
              "event": "workflow_dispatch",
              "head_branch": "main",
              "head_sha": expected_sha,
              "status": "completed",
              "conclusion": "success",
          }
          for key, value in expected.items():
              assert run.get(key) == value, (key, run.get(key), value)
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install "PyYAML>=6,<7"

      - name: Vérifier les pins et produire le rapport JSON
        run: python scripts/check-pins.py --json

      - name: Download exactly the qualified Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: cookigram-pages-${{ env.CONTENT_SHA }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CI_RUN_ID }}
          path: _site

      - name: Verify consumer fragments in generated site
        run: python scripts/check-generated-surfaces.py --site-dir _site

      - name: Verify qualified artifact provenance
        env:
          EXPECTED_CORE_SHA: ${{ steps.builder.outputs.core_sha }}
          EXPECTED_CONTENT_SHA: ${{ env.CONTENT_SHA }}
          EXPECTED_BUILDER_RELEASE: ${{ steps.builder.outputs.release }}
          EXPECTED_BUILDER_ARTIFACT: ${{ steps.builder.outputs.artifact }}
          EXPECTED_BUILDER_SHA256: ${{ steps.builder.outputs.sha256 }}
          EXPECTED_CONTRACT_VERSION: ${{ steps.builder.outputs.contract_version }}
          EXPECTED_CONTRACT_SOURCE_SHA: ${{ steps.builder.outputs.contract_source_sha }}
          EXPECTED_CONTRACT_ARTIFACT: ${{ steps.builder.outputs.contract_artifact }}
          EXPECTED_CONTRACT_SHA256: ${{ steps.builder.outputs.contract_sha256 }}
          EXPECTED_CI_RUN_ID: ${{ env.CI_RUN_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = json.loads(Path("_site/provenance.json").read_text(encoding="utf-8"))
          expected = {
              "content_sha": os.environ["EXPECTED_CONTENT_SHA"],
              "core_sha": os.environ["EXPECTED_CORE_SHA"],
              "contract_version": os.environ["EXPECTED_CONTRACT_VERSION"],
              "contract_source_sha": os.environ["EXPECTED_CONTRACT_SOURCE_SHA"],
              "contract_artifact": os.environ["EXPECTED_CONTRACT_ARTIFACT"],
              "contract_sha256": os.environ["EXPECTED_CONTRACT_SHA256"],
              "builder_release": os.environ["EXPECTED_BUILDER_RELEASE"],
              "builder_artifact": os.environ["EXPECTED_BUILDER_ARTIFACT"],
              "builder_sha256": os.environ["EXPECTED_BUILDER_SHA256"],
              "pages_artifact": f"cookigram-pages-{os.environ['EXPECTED_CONTENT_SHA']}",
              "qualifying_ci_run_id": os.environ["EXPECTED_CI_RUN_ID"],
          }
          for key, value in expected.items():
              assert provenance.get(key) == value, (key, provenance.get(key), value)
          print(json.dumps(provenance, indent=2))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
