name: Deploy GitHub Pages
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CONTENT_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout CookiGram Recettes (Public)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_SHA }}

      - name: Read pinned Core SHA
        id: core-ref
        run: echo "sha=$(cat .core-version | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install "PyYAML>=6,<7"

      - name: Vérifier les pins et produire le rapport JSON
        run: python scripts/check-pins.py --json

      - name: Checkout CookiGram Core Engine (Private)
        uses: actions/checkout@v4
        with:
          repository: CookiGram/cookigram-core
          ssh-key: ${{ secrets.CORE_SSH_KEY }}
          ref: ${{ steps.core-ref.outputs.sha }}
          path: core

      - name: Install Core Engine & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./core

      - name: Build Static Site & PWA
        run: python -m generator.build --content-dir . --output _site

      - name: Write build provenance
        env:
          CORE_SHA: ${{ steps.core-ref.outputs.sha }}
        run: |
          python -c '
          import datetime, json, os
          data = {
              "content_sha": os.environ["CONTENT_SHA"],
              "core_sha": os.environ["CORE_SHA"],
              "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          with open("_site/provenance.json", "w") as f:
              json.dump(data, f, indent=2)
          '

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
