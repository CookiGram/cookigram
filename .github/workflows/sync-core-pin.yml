name: Sync Core pin

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-core-pin
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Converge Core pin
    runs-on: ubuntu-latest
    env:
      BRANCH: automation/core-pin
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout CookiGram consumer
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout latest Core main
        uses: actions/checkout@v4
        with:
          repository: CookiGram/cookigram-core
          ssh-key: ${{ secrets.CORE_SSH_KEY }}
          ref: main
          path: core
          fetch-depth: 1

      - name: Resolve Core candidate
        id: core
        shell: bash
        run: |
          set -euo pipefail
          target="$(git -C core rev-parse HEAD)"
          pinned="$(tr -d '[:space:]' < .core-version)"
          echo "target=${target}" >> "$GITHUB_OUTPUT"
          echo "pinned=${pinned}" >> "$GITHUB_OUTPUT"
          if [[ "$target" == "$pinned" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Core pin already converged at ${target}."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Core pin needs update: ${pinned} -> ${target}."
          fi

      - name: Prepare validated candidate branch
        if: steps.core.outputs.changed == 'true'
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf core
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH" origin/main
          printf '%s\n' '${{ steps.core.outputs.target }}' > .core-version

          changed_files="$(git diff --name-only)"
          if [[ "$changed_files" != ".core-version" ]]; then
            echo "Unexpected files in Core pin update:" >&2
            printf '%s\n' "$changed_files" >&2
            exit 1
          fi

          git add .core-version
          git commit -m "chore(core): pin latest validated Core"
          candidate="$(git rev-parse HEAD)"
          base="$(git rev-parse origin/main)"
          echo "sha=${candidate}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          git push --force-with-lease origin "HEAD:${BRANCH}"

      - name: Run consumer CI explicitly
        if: steps.core.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: Wait for candidate CI
        if: steps.core.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          candidate='${{ steps.candidate.outputs.sha }}'
          run_id=""

          for _ in $(seq 1 60); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --branch "$BRANCH" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${candidate}\") | .databaseId" \
              | head -n1)"
            [[ -n "$run_id" ]] && break
            sleep 5
          done

          if [[ -z "$run_id" ]]; then
            echo "Could not locate the explicitly dispatched CI run for ${candidate}." >&2
            exit 1
          fi

          echo "Waiting for CI run ${run_id}."
          if ! gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status; then
            echo "Consumer CI failed; refusing to update main." >&2
            exit 1
          fi

      - name: Fast-forward validated pin to main
        if: steps.core.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          candidate='${{ steps.candidate.outputs.sha }}'
          expected_base='${{ steps.candidate.outputs.base }}'

          git fetch origin main
          actual_base="$(git rev-parse origin/main)"
          if [[ "$actual_base" != "$expected_base" ]]; then
            echo "main moved during validation (${actual_base} != ${expected_base}); refusing update and letting the next sync retry." >&2
            exit 1
          fi

          parent="$(git rev-parse "${candidate}^")"
          if [[ "$parent" != "$expected_base" ]]; then
            echo "Candidate parent ${parent} does not match expected main ${expected_base}." >&2
            exit 1
          fi

          git push origin "${candidate}:main"

      - name: Verify converged main
        if: steps.core.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          candidate='${{ steps.candidate.outputs.sha }}'
          if [[ "$main_sha" != "$candidate" ]]; then
            echo "main did not converge to validated candidate (${main_sha} != ${candidate})." >&2
            exit 1
          fi

      - name: Pages deployment follows successful main CI
        if: steps.core.outputs.changed == 'true'
        run: |
          echo "Validated pin is now on main. The push triggers CI on main; pages.yml will deploy only after that CI succeeds."
